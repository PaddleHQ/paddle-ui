name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm tsc --noEmit

      - run: pnpm format:check

      # public/r is what `shadcn add` serves, so it must match the sources
      - name: Check registry build is up to date
        run: |
          pnpm registry:build
          if ! git diff --exit-code -- public/r || [ -n "$(git status --porcelain -- public/r)" ]; then
            echo "::error::public/r is out of date. Run 'pnpm registry:build' and commit the result."
            exit 1
          fi
